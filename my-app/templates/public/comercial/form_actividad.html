{% extends 'public/base_cpanel.html' %}

{% block title %}Registrar Actividad Comercial{% endblock %}

{% block customCSS %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<style>
  .select2-container { max-width: 100%; }
  #wrap_cliente .select2-container,
  #wrap_prospecto_existente .select2-container { width: 100% !important; display: block; }
</style>
{% endblock %}

{% block body %}
<div class="card shadow-sm" style="border-radius: 10px;">
  <div class="card-header bg-primary text-white text-center">
    <h3 class="fw-bold">REGISTRO DE ACTIVIDAD COMERCIAL</h3>
  </div>
  <div class="card-body p-4">
    <form class="form-horizontal mx-auto" method="POST" action="/form-registrar-actividad-comercial" autocomplete="off" id="registroActividadForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-4">
        <div class="col-md-4">
          <label for="id_empleado" class="form-label fw-bold text-primary">Vendedor <span class="text-danger">*</span></label>
          <select name="id_empleado" id="id_empleado" class="form-control select2" required></select>
        </div>
        <div class="col-md-4">
          <label for="tipo_actividad" class="form-label fw-bold text-primary">Tipo de Actividad <span class="text-danger">*</span></label>
          <select name="tipo_actividad" id="tipo_actividad" class="form-control" required>
            <option value="" selected disabled>Seleccione...</option>
            {% for t in tipos_actividad %}
            <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold text-primary d-block">Referencia <span class="text-danger">*</span></label>
          <div class="btn-group btn-group-sm w-100" role="group">
            <input type="radio" class="btn-check" name="tipo_referencia" id="tipo_cliente" value="cliente" checked>
            <label class="btn btn-outline-primary" for="tipo_cliente">Cliente</label>
            <input type="radio" class="btn-check" name="tipo_referencia" id="tipo_prospecto_existente" value="prospecto_existente">
            <label class="btn btn-outline-primary" for="tipo_prospecto_existente">Prospecto</label>
            <input type="radio" class="btn-check" name="tipo_referencia" id="tipo_prospecto_nuevo" value="prospecto_nuevo">
            <label class="btn btn-outline-primary" for="tipo_prospecto_nuevo">Prospecto nuevo</label>
          </div>
        </div>
      </div>

      <div class="row g-4 mt-1">
        <div class="col-md-12">
          <div id="wrap_cliente">
            <select name="id_cliente" id="id_cliente" class="form-control select2" style="width:100%"></select>
          </div>
          <div id="wrap_prospecto_existente" style="display:none;">
            <select name="id_prospecto" id="id_prospecto" class="form-control select2" style="width:100%"></select>
          </div>
          <div id="wrap_prospecto_nuevo" style="display:none;">
            <div class="row g-3">
              <div class="col-md-3">
                <input type="text" name="nombre_prospecto_nuevo" id="nombre_prospecto_nuevo" class="form-control" placeholder="Nombre de la persona de contacto, ej: Juan Pérez *">
              </div>
              <div class="col-md-3">
                <input type="text" name="empresa_prospecto_nuevo" class="form-control" placeholder="Empresa donde trabaja el contacto (opcional)">
              </div>
              <div class="col-md-2">
                <input type="text" name="cargo_prospecto_nuevo" class="form-control" placeholder="Cargo, ej: Gerente de compras (opcional)">
              </div>
              <div class="col-md-2">
                <input type="text" name="telefono_prospecto_nuevo" class="form-control" placeholder="Teléfono de contacto (opcional)">
              </div>
              <div class="col-12">
                <select name="medio_contacto_nuevo" id="medio_contacto_nuevo" class="form-control">
                  <option value="" selected>¿Cómo se consiguió este prospecto? (opcional)</option>
                  {% for m in medios_contacto %}
                  <option value="{{ m }}">{{ m }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-2">
                <input type="email" name="email_prospecto_nuevo" class="form-control" placeholder="Correo de contacto (opcional)">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4 mt-1">
        <div class="col-md-6">
          <label for="fecha_hora_inicio" class="form-label fw-bold text-primary">Fecha y Hora Inicio <span class="text-danger">*</span></label>
          <input class="form-control" type="datetime-local" name="fecha_hora_inicio" id="fecha_hora_inicio" required />
        </div>
        <div class="col-md-6">
          <label for="fecha_hora_fin" class="form-label fw-bold text-primary">Fecha y Hora Fin <span class="text-muted small">(opcional)</span></label>
          <input class="form-control" type="datetime-local" name="fecha_hora_fin" id="fecha_hora_fin" />
        </div>
      </div>

      <div class="row g-4 mt-1">
        <div class="col-md-12">
          <label for="alcance" class="form-label fw-bold text-primary">Alcance / Objetivo de la Actividad <span class="text-danger">*</span></label>
          <textarea class="form-control" name="alcance" id="alcance" rows="2" required></textarea>
        </div>
      </div>

      <div class="row g-4 mt-1">
        <div class="col-md-6">
          <label for="resultado" class="form-label fw-bold text-primary">Resultado / Observaciones</label>
          <textarea class="form-control" name="resultado" id="resultado" rows="2"></textarea>
        </div>
        <div class="col-md-6">
          <label for="proximo_paso" class="form-label fw-bold text-primary">Próximo Paso Sugerido</label>
          <textarea class="form-control" name="proximo_paso" id="proximo_paso" rows="2"></textarea>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-12 text-end">
          <a href="{{ url_for('lista_actividad_comercial') }}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary" id="submitBtn">Guardar Actividad</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block customJS %}
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
$(function() {
  function setupSelect2(selectId, url, placeholder, dataKey, idField, textField) {
    $(`#${selectId}`).select2({
      placeholder: placeholder,
      allowClear: true,
      minimumInputLength: 0,
      width: '100%',
      ajax: {
        url: url,
        dataType: 'json',
        delay: 250,
        data: params => ({ search: params.term || '', page: params.page || 1, per_page: 10 }),
        processResults: (data, params) => {
          params.page = params.page || 1;
          return {
            results: data[dataKey].map(item => ({ id: item[idField], text: item[textField] })),
            pagination: { more: (params.page * 10) < data.total }
          };
        },
        cache: true
      }
    }).on('select2:open', function() {
      setTimeout(() => { document.querySelector('.select2-search__field')?.focus(); }, 50);
    });
  }

  setupSelect2('id_empleado', '/api/vendedores-comerciales', 'Buscar vendedor...', 'empleados', 'id_empleado', 'nombre_empleado');

  // Cliente: el endpoint ya devuelve {clientes, pagination}
  $('#id_cliente').select2({
    placeholder: 'Buscar cliente...', allowClear: true, minimumInputLength: 0, width: '100%',
    ajax: {
      url: '/api/clientes', dataType: 'json', delay: 250,
      data: params => ({ search: params.term || '', page: params.page || 1, per_page: 10 }),
      processResults: (data, params) => {
        params.page = params.page || 1;
        return {
          results: data.clientes.map(c => ({ id: c.id_cliente, text: c.nombre_cliente })),
          pagination: { more: data.pagination && data.pagination.more }
        };
      },
      cache: true
    }
  });

  // Prospecto: el endpoint ya devuelve el formato nativo {results, pagination}
  $('#id_prospecto').select2({
    placeholder: 'Buscar prospecto...', allowClear: true, minimumInputLength: 0, width: '100%',
    ajax: {
      url: '/api/prospectos', dataType: 'json', delay: 250,
      data: params => ({ search: params.term || '', page: params.page || 1, per_page: 10 }),
      processResults: data => data,
      cache: true
    }
  });

  // --- Toggle Referencia: Cliente / Prospecto existente / Prospecto nuevo ---
  function aplicarTipoReferencia() {
    const tipo = $('input[name="tipo_referencia"]:checked').val();
    $('#wrap_cliente, #wrap_prospecto_existente, #wrap_prospecto_nuevo').hide();
    $('#nombre_prospecto_nuevo').prop('required', false);
    if (tipo === 'cliente') {
      $('#wrap_cliente').show();
      $('#id_prospecto').val(null).trigger('change');
      $('input[name="nombre_prospecto_nuevo"], input[name="empresa_prospecto_nuevo"], input[name="cargo_prospecto_nuevo"], input[name="telefono_prospecto_nuevo"], input[name="email_prospecto_nuevo"]').val('');
      $('#medio_contacto_nuevo').val('');
    } else if (tipo === 'prospecto_existente') {
      $('#wrap_prospecto_existente').show();
      $('#id_cliente').val(null).trigger('change');
      $('input[name="nombre_prospecto_nuevo"], input[name="empresa_prospecto_nuevo"], input[name="cargo_prospecto_nuevo"], input[name="telefono_prospecto_nuevo"], input[name="email_prospecto_nuevo"]').val('');
      $('#medio_contacto_nuevo').val('');
    } else {
      $('#wrap_prospecto_nuevo').show();
      $('#nombre_prospecto_nuevo').prop('required', true);
      $('#id_cliente').val(null).trigger('change');
      $('#id_prospecto').val(null).trigger('change');
    }
  }
  $('input[name="tipo_referencia"]').on('change', aplicarTipoReferencia);
  aplicarTipoReferencia();

  function referenciaValida() {
    const tipo = $('input[name="tipo_referencia"]:checked').val();
    if (tipo === 'cliente') return !!$('#id_cliente').val();
    if (tipo === 'prospecto_existente') return !!$('#id_prospecto').val();
    return !!$('#nombre_prospecto_nuevo').val().trim();
  }

  $('#registroActividadForm').on('submit', function(e) {
    const form = this;
    if (!form.checkValidity()) {
      form.reportValidity();
      e.preventDefault();
      return;
    }
    if (!referenciaValida()) {
      e.preventDefault();
      alert('Debe seleccionar un Cliente, un Prospecto existente, o indicar el nombre de un Prospecto nuevo.');
      return;
    }
    $('#submitBtn').prop('disabled', true).text('Guardando...');
  });
});
</script>
{% endblock %}
